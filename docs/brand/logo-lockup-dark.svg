<svg xmlns="http://www.w3.org/2000/svg" width="460" height="96" viewBox="0 0 460 96" role="img" aria-label="AgentControl">
  <!-- Horizontal lockup, dark backgrounds (GitHub dark mode) -->
  <defs>
    <linearGradient id="bg" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,16)">
    <rect width="64" height="64" rx="14.4" fill="url(#bg)"/>
    <g stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round" fill="none">
      <path d="M32 14 15.5 50.5"/>
      <path d="M32 14 48.5 50.5"/>
      <path d="M22 38h20"/>
    </g>
    <circle cx="32" cy="14" r="5.2" fill="#FFFFFF"/>
    <circle cx="37.5" cy="38" r="4.4" fill="#818CF8" stroke="#FFFFFF" stroke-width="2.6"/>
  </g>
  <text x="84" y="51" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">
    <tspan fill="#F8FAFC">Agent</tspan><tspan fill="#A5B4FC">Control</tspan>
  </text>
  <text x="85" y="73" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" fill="#94A3B8">One control plane for MCP servers, providers &amp; skills</text>
</svg>
