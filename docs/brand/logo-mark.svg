<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="AgentControl">
  <!--
    AgentControl mark: an "A" whose apex is an agent node and whose crossbar
    carries a control knob — many agents, one switchboard.
    Brand gradient matches web UI tokens: brand-500 #6366F1 -> violet-500 #8B5CF6.
  -->
  <defs>
    <linearGradient id="bg" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14.4" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round" fill="none">
    <path d="M32 14 15.5 50.5"/>
    <path d="M32 14 48.5 50.5"/>
    <path d="M22 38h20"/>
  </g>
  <circle cx="32" cy="14" r="5.2" fill="#FFFFFF"/>
  <circle cx="37.5" cy="38" r="4.4" fill="#6366F1" stroke="#FFFFFF" stroke-width="2.6"/>
</svg>
